<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>課題管理表</title>
<style>
*{box-sizing:border-box}
:root{
  --bg:#f4f4f2;--surface:#fff;--surface-2:#f9f9f7;--hover:#f0efeb;
  --border:#e3e2dd;--border-strong:#cfcdc6;
  --text:#1d1d1b;--text-2:#52514e;--muted:#8a8984;
  --accent:#2a78d6;--accent-ink:#1c5cab;--accent-weak:#e6f0fc;
  --danger:#c4352f;--danger-weak:#fdecea;
  --warn-bg:#fff6dc;--warn-border:#efd27c;
  --ok:#1e7b1e;
  --radius:8px;
  --font:system-ui,-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",sans-serif;
  color-scheme:light;
}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:13px/1.5 var(--font);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
#app{display:flex;flex-direction:column;height:100vh;min-width:0}

/* ---------- top ---------- */
.top{background:var(--surface);border-bottom:1px solid var(--border);padding:8px 16px 0}
.top-row{display:flex;align-items:center;gap:10px;min-height:36px;flex-wrap:wrap}
.title-input{font-size:17px;font-weight:700;border:1px solid transparent;border-radius:6px;padding:2px 6px;background:transparent;min-width:120px;max-width:420px}
.title-input:hover{border-color:var(--border)}
.title-input:focus{outline:none;border-color:var(--accent);background:#fff}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:999px;padding:2px 10px;font-size:12px;color:var(--text-2);background:var(--surface-2);white-space:nowrap;max-width:320px;overflow:hidden;text-overflow:ellipsis}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.chip.ok .dot{background:#0ca30c}
.chip.warn .dot{background:#eda100}
.chip.off .dot{background:var(--danger)}
.spacer{flex:1}
.btn{border:1px solid var(--border-strong);background:var(--surface);border-radius:6px;padding:4px 12px;line-height:20px;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-ink)}
.btn.danger{color:var(--danger);border-color:#e7b4b0}
.btn.danger:hover{background:var(--danger-weak)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--hover)}
.btn.sm{padding:2px 8px;font-size:12px}
.btn:disabled{opacity:.5;cursor:default}
.tabs{display:flex;gap:2px;margin-top:6px;align-items:flex-end}
.tab{border:none;background:none;padding:8px 14px;border-bottom:2px solid transparent;color:var(--text-2);font-weight:600}
.tab:hover{color:var(--text)}
.tab.on{color:var(--accent-ink);border-bottom-color:var(--accent)}
.tabs .spacer{align-self:stretch}
.tabs .btn{margin-bottom:6px}

/* ---------- banner ---------- */
.banner{display:flex;align-items:center;gap:10px;padding:8px 16px;background:var(--warn-bg);border-bottom:1px solid var(--warn-border);font-size:13px;flex-wrap:wrap}
.banner.info{background:var(--accent-weak);border-bottom-color:#bcd5f5}
.banner.err{background:var(--danger-weak);border-bottom-color:#f0c0bb}
.banner b{font-weight:700}

/* ---------- toolbar ---------- */
.toolbar{display:flex;align-items:center;gap:8px;padding:8px 16px;flex-wrap:wrap;background:var(--bg)}
.search{border:1px solid var(--border-strong);border-radius:6px;padding:4px 10px;width:220px;background:#fff}
.search:focus,.inp:focus,.sel:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
.qchips{display:flex;gap:4px;flex-wrap:wrap}
.qchip{border:1px solid var(--border-strong);background:#fff;border-radius:999px;padding:2px 10px;font-size:12px}
.qchip:hover{background:var(--hover)}
.qchip.on{background:var(--text);border-color:var(--text);color:#fff}
.fchip{display:inline-flex;align-items:center;gap:4px;background:var(--accent-weak);color:var(--accent-ink);border-radius:999px;padding:2px 4px 2px 10px;font-size:12px}
.fchip button{border:none;background:none;color:inherit;padding:0 4px;border-radius:50%}
.fchip button:hover{background:#cfe0f7}
.count{color:var(--muted);font-size:12px}
.count select{color:var(--text)}

/* ---------- main ---------- */
main{flex:1;min-height:0;position:relative;display:flex;flex-direction:column}
.table-wrap{flex:1;overflow:auto;background:var(--surface);border-top:1px solid var(--border)}
.grid{border-collapse:separate;border-spacing:0;table-layout:fixed;width:max-content;min-width:100%}
.grid th,.grid td{border-right:1px solid var(--border);border-bottom:1px solid var(--border);padding:0 8px;height:32px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left;vertical-align:middle}
.grid thead th{position:sticky;top:0;background:var(--surface-2);z-index:3;font-weight:600;color:var(--text-2);padding:0 0 0 8px;user-select:none}
.grid thead th.filtered{color:var(--accent-ink)}
.th-in{display:flex;align-items:center;gap:2px;height:32px}
.th-name{flex:1;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.th-ind{font-size:10px;color:var(--accent)}
.th-btn{border:none;background:none;color:var(--muted);width:22px;height:22px;border-radius:4px;flex:none;padding:0}
.th-btn:hover{background:var(--hover);color:var(--text)}
.resizer{position:absolute;right:-3px;top:0;bottom:0;width:7px;cursor:col-resize;z-index:4}
.resizer:hover,.resizer.drag{background:var(--accent);opacity:.4}
.grid th{position:sticky}
.grid td{background:var(--surface);cursor:default;vertical-align:top;padding-top:6px;padding-bottom:6px;line-height:20px}
.grid td.c-no{padding-left:2px;padding-right:2px}
.no-cell{display:flex;align-items:center;gap:1px}
.grip{cursor:grab;color:var(--muted);opacity:0;width:14px;text-align:center;user-select:none;font-size:11px;letter-spacing:-3px;flex:none;padding-right:3px}
.row-menu{border:none;background:none;color:var(--muted);opacity:0;padding:0 5px;border-radius:4px;margin-left:auto;line-height:20px}
.grid tr:hover .grip,.grid tr:hover .row-menu,.grid td.sel .grip,.grid td.sel .row-menu{opacity:1}
.row-menu:hover{background:var(--hover);color:var(--text)}
.tw{display:flex;align-items:flex-start;gap:4px;min-width:0}
.tw .tt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:0 1 auto}
.tg{border:none;background:none;width:16px;height:20px;padding:0;color:var(--text-2);flex:none;border-radius:3px;font-size:9px}
.tg:hover{background:var(--hover);color:var(--text)}
.tg-sp{width:16px;flex:none;color:var(--muted);text-align:center}
.kids{font-size:11px;color:var(--text-2);border:1px solid var(--border-strong);border-radius:999px;padding:0 6px;flex:none;line-height:16px;margin-top:2px;background:#fff;font-variant-numeric:tabular-nums}
.grid tr.ctx td{opacity:.5}
.grid td.t-longtext{white-space:normal}
.lt-wrap{display:flex;gap:4px;align-items:flex-start}
.lt{white-space:pre-wrap;word-break:break-word;flex:1;min-width:0}
.lt.one{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:0 1 auto}
.lt-more{color:var(--muted);font-size:12px;flex:none}
.lt-tg{border:none;background:none;color:var(--muted);font-size:9px;width:18px;height:20px;padding:0;border-radius:3px;flex:none;margin-left:auto}
.lt-tg:hover{background:var(--hover);color:var(--text)}
.lnk{color:var(--accent-ink);text-decoration:none}
.lnk:hover{text-decoration:underline}
.drop-line{position:fixed;height:2px;background:var(--accent);z-index:70;pointer-events:none;border-radius:2px;display:none}
.drop-line::before{content:'';position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.grid tr.dragging td{opacity:.35}
body.row-dragging,body.row-dragging *{cursor:grabbing!important}
.kc-parent{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kc-kids{font-size:11px;color:var(--text-2);margin-left:6px}
.kcard.drop-before{box-shadow:0 -3px 0 0 var(--accent)}
.kcards.drop-end::after{content:'';display:block;height:3px;background:var(--accent);border-radius:2px;flex:none}
.kc-lt{white-space:pre-wrap;word-break:break-word}
.le{display:flex;flex-direction:column;gap:8px;max-height:60vh;overflow:auto;align-items:flex-start}
.le-row{display:flex;gap:6px;align-items:flex-start;border:1px solid var(--border);border-radius:8px;padding:8px;width:100%;background:var(--surface-2)}
.le-in{flex:1;display:grid;gap:6px;min-width:0}
.le-st{min-height:16px;line-height:16px;font-size:11px;margin-top:-2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lnks{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-width:0}
.lnks a{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.grid td.t-link{white-space:normal;position:relative}
.grid td.t-link .lnks{padding-right:22px}
.lnk-add{position:absolute;top:5px;right:4px;width:22px;height:22px;border:1px solid var(--border-strong);border-radius:5px;background:#fff;color:var(--accent-ink);font-size:14px;line-height:1;padding:0;opacity:0;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.grid tr:hover td.t-link .lnk-add,.grid td.t-link.sel .lnk-add,.lnk-add:focus-visible{opacity:1}
.lnk-add:hover{background:var(--accent-weak);border-color:var(--accent)}
.kc-meta .lnks{display:inline-flex;flex-direction:row;flex-wrap:wrap;gap:2px 10px}
.kid-list{display:flex;flex-direction:column;gap:2px;margin-bottom:6px}
.kid-list button{display:flex;gap:8px;align-items:center;border:none;background:none;padding:3px 6px;border-radius:5px;text-align:left}
.kid-list button:hover{background:var(--hover)}
.grid .c-no{position:sticky;left:0;z-index:2}
.grid thead .c-no{z-index:4}
.grid td.c-no{box-shadow:inset -1px 0 0 var(--border)}
.grid tbody tr:hover td{background-image:linear-gradient(rgba(0,0,0,.03),rgba(0,0,0,.03))}
.grid td.sel{outline:2px solid var(--accent);outline-offset:-2px}
.grid td.ro{color:var(--text-2)}
.grid td.t-number{text-align:right;font-variant-numeric:tabular-nums}
.grid td.t-checkbox{text-align:center}
.grid .c-add{width:44px;border-right:none}
.th-add{border:none;background:none;font-size:16px;color:var(--muted);width:32px;height:28px;border-radius:4px}
.th-add:hover{background:var(--hover);color:var(--accent)}
.add-row td{border-bottom:none;padding:0}
.add-row button{border:none;background:none;color:var(--muted);padding:6px 12px;width:100%;text-align:left}
.add-row button:hover{color:var(--accent);background:var(--surface-2)}
.no-link{border:none;background:none;padding:0;color:var(--accent-ink);font-variant-numeric:tabular-nums}
.no-link:hover{text-decoration:underline}
.cb{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border:1.5px solid var(--border-strong);border-radius:4px;font-size:11px;line-height:1;cursor:pointer;background:#fff;vertical-align:middle;color:#fff}
.cb.on{background:var(--accent);border-color:var(--accent)}
.pill{display:inline-block;padding:0 8px;border-radius:999px;font-size:12px;line-height:20px;background:color-mix(in srgb,var(--c) 16%,white);color:color-mix(in srgb,var(--c) 72%,black);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
.empty{padding:48px 16px;text-align:center;color:var(--text-2)}
.empty p{margin:0 0 12px}

.cell-editor{position:fixed;z-index:50;border:2px solid var(--accent);border-radius:2px;padding:4px 7px;background:#fff;box-shadow:0 4px 16px rgba(0,0,0,.15);outline:none;font-size:13px}
textarea.cell-editor{resize:both;line-height:1.5}

/* ---------- kanban ---------- */
.kanban{flex:1;overflow:auto;display:flex;gap:12px;padding:4px 16px 16px;align-items:flex-start}
.kcol{flex:0 0 272px;background:#ebebe7;border-radius:10px;display:flex;flex-direction:column;max-height:100%}
.kcol header{display:flex;align-items:center;gap:8px;padding:10px 12px 6px;font-weight:700}
.kdot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.kcount{color:var(--muted);font-weight:400;font-size:12px}
.kcards{flex:1;overflow:auto;padding:4px 8px;min-height:40px;display:flex;flex-direction:column;gap:8px;border-radius:8px}
.kcards.over{background:rgba(42,120,214,.12)}
.kcard{background:#fff;border-radius:8px;padding:8px 10px;box-shadow:0 1px 2px rgba(0,0,0,.08);border:1px solid var(--border);cursor:grab}
.kcard:hover{border-color:var(--border-strong)}
.kcard.dragging{opacity:.4}
.kc-no{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.kc-title{font-weight:600;margin:2px 0 6px;word-break:break-word}
.kc-meta{display:flex;flex-wrap:wrap;gap:4px 8px;font-size:12px;color:inherit;align-items:center}
.kc-meta .lbl{color:var(--muted);margin-right:2px}
.kadd{border:none;background:none;color:var(--text-2);text-align:left;padding:8px 12px 10px;border-radius:0 0 10px 10px}
.kadd:hover{color:var(--accent-ink);background:rgba(0,0,0,.04)}

/* ---------- dashboard ---------- */
.dash{flex:1;overflow:auto;padding:4px 16px 24px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 14px;text-align:left}
.tile:hover{border-color:var(--border-strong);background:var(--surface-2)}
.tile .t-label{color:var(--text-2);font-size:12px;display:flex;align-items:center;gap:6px}
.tile .t-num{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.3}
.tile .t-sub{color:var(--muted);font-size:12px}
.tile.critical .t-label{color:#b42318}
.tile.warning .t-label{color:#8a5a00}
.sicon{display:inline-flex;width:16px;height:16px;border-radius:50%;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;flex:none}
.sicon.critical{background:#d03b3b}
.sicon.warning{background:#fab219;color:#3d2a00}
.cards2{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px;min-width:0}
.card h3{margin:0 0 10px;font-size:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3 select{font-weight:400;font-size:12px}
.bars{display:flex;flex-direction:column;gap:6px}
.bar-row{display:grid;grid-template-columns:minmax(64px,120px) 1fr 44px;align-items:center;gap:8px}
.bar-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text-2)}
.bar-track{height:14px;display:flex;gap:2px}
.bar-seg{height:100%;border-radius:0;min-width:2px}
.bar-seg:last-child{border-radius:0 4px 4px 0}
.bar-val{text-align:right;font-variant-numeric:tabular-nums;color:var(--text)}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--text-2);margin-bottom:8px}
.legend span{display:inline-flex;align-items:center;gap:4px}
.legend i{width:10px;height:10px;border-radius:2px;background:var(--c);display:inline-block}
.list{display:flex;flex-direction:column}
.list-row{display:grid;grid-template-columns:86px 48px 1fr auto;gap:8px;align-items:center;padding:6px 4px;border-bottom:1px solid var(--border);border-radius:4px;cursor:pointer;text-align:left;background:none;border-left:none;border-right:none;border-top:none;width:100%}
.list-row:hover{background:var(--surface-2)}
.list-row .muted{color:var(--muted);font-size:12px}
.list-row .ttl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.due-over{color:#b42318;font-weight:600}
.due-soon{color:#8a5a00;font-weight:600}
.muted{color:var(--muted)}

/* ---------- popover / modal ---------- */
.pop{position:fixed;z-index:90;background:#fff;border:1px solid var(--border-strong);border-radius:8px;box-shadow:0 8px 28px rgba(0,0,0,.16);min-width:200px;max-width:340px;padding:6px;font-size:13px}
.pop .mi{display:flex;align-items:center;gap:8px;width:100%;border:none;background:none;text-align:left;padding:6px 10px;border-radius:5px;white-space:nowrap}
.pop .mi:hover,.pop .mi.act{background:var(--hover)}
.pop .mi.danger{color:var(--danger)}
.pop .mi .ic{width:16px;text-align:center;color:var(--muted)}
.pop hr{border:none;border-top:1px solid var(--border);margin:6px 0}
.pop .sec{padding:4px 10px;font-size:11px;color:var(--muted);font-weight:600}
.pop-search{width:100%;border:1px solid var(--border-strong);border-radius:5px;padding:4px 8px;margin-bottom:4px}
.pop-search:focus{outline:2px solid var(--accent);outline-offset:-1px}
.pop-list{max-height:260px;overflow:auto}
.pop-list label{display:flex;align-items:center;gap:8px;padding:3px 8px;border-radius:4px;cursor:pointer}
.pop-list label:hover{background:var(--hover)}
.pop-foot{display:flex;gap:6px;justify-content:flex-end;padding-top:6px;border-top:1px solid var(--border);margin-top:4px}
.choice{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:5px;cursor:pointer}
.choice.act{background:var(--accent-weak)}
.choice .ck{width:16px;color:var(--accent);font-weight:700}
.choice.add{color:var(--accent-ink)}
.choice.clear{color:var(--muted)}

.overlay{position:fixed;inset:0;background:rgba(20,20,18,.32);z-index:80;display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px;overflow:auto}
.modal{background:#fff;border-radius:12px;box-shadow:0 16px 48px rgba(0,0,0,.24);width:100%;max-width:560px;display:flex;flex-direction:column;max-height:88vh}
.modal.wide{max-width:780px}
.modal-h{display:flex;align-items:center;gap:8px;padding:14px 18px;border-bottom:1px solid var(--border)}
.modal-h h2{margin:0;font-size:16px;flex:1}
.modal-x{border:none;background:none;font-size:20px;line-height:1;color:var(--muted);width:30px;height:30px;border-radius:6px}
.modal-x:hover{background:var(--hover)}
.modal-b{padding:16px 18px;overflow:auto}
.modal-f{display:flex;gap:8px;align-items:center;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--border);flex-wrap:wrap}
.modal-f .left{margin-right:auto;display:flex;gap:8px}
.frm{display:grid;grid-template-columns:120px 1fr;gap:10px 14px;align-items:start}
.frm>label{padding-top:5px;color:var(--text-2);font-weight:600;font-size:12px}
.frm .req::after{content:" *";color:var(--danger)}
.inp,.sel{border:1px solid var(--border-strong);border-radius:6px;padding:5px 8px;background:#fff;width:100%}
textarea.inp{min-height:84px;resize:vertical;line-height:1.5}
.sel{width:auto;max-width:100%}
.hint{color:var(--muted);font-size:12px;margin-top:4px}
.ms{display:flex;flex-wrap:wrap;gap:6px;padding-top:3px}
.ms label{display:inline-flex;align-items:center;gap:4px;cursor:pointer}
.ro-val{padding-top:5px;color:var(--text-2)}
.flist{display:flex;flex-direction:column;border:1px solid var(--border);border-radius:8px}
.frow{display:flex;align-items:center;gap:8px;padding:6px 10px;border-bottom:1px solid var(--border)}
.frow:last-child{border-bottom:none}
.frow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frow .tp{color:var(--muted);font-size:12px;width:96px}
.tag{font-size:11px;color:var(--muted);border:1px solid var(--border);border-radius:4px;padding:0 5px;margin-left:6px}
.iconbtn{border:1px solid transparent;background:none;border-radius:5px;width:26px;height:26px;color:var(--text-2);padding:0;flex:none}
.iconbtn:hover{background:var(--hover);border-color:var(--border)}
.iconbtn:disabled{opacity:.3;cursor:default;background:none;border-color:transparent}
.opt-row{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.opt-row .inp{flex:1}
.swatch{width:22px;height:22px;border-radius:5px;border:1px solid rgba(0,0,0,.12);background:var(--c);flex:none;padding:0;position:relative}
.swatches{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.swatches .swatch.on{outline:2px solid var(--text);outline-offset:1px}
.swatch.none{background:repeating-linear-gradient(135deg,#fff 0 4px,#e6e5e0 4px 6px)}
.cond-row{display:flex;gap:6px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
.cond-row .inp{width:140px}
.preview{display:inline-block;padding:4px 12px;border:1px solid var(--border);border-radius:4px;min-width:150px}

<noscript>この課題管理表は JavaScript を有効にした Chrome または Edge で開いてください。</noscript>
<script>
(function () {
'use strict';

/* ============================================================
   保存の仕組み
   - 課題データはこのHTMLの <script id="issue-data"> に JSON で埋め込まれている
   - 保存時は File System Access API でこのファイル自身を上書きする
   - 開いている間は定期的にファイルを確認し、他の人の保存を検知したら取り込む
   - 取り込み・保存時は「前回読んだ内容」を基準に、課題・項目ごとに3方向マージする
   ============================================================ */

const DATA_OPEN = '<script id="issue-data" type="application/json">';
const DATA_CLOSE = '</' + 'script>';
const TEMPLATE = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
const FS = typeof window.showOpenFilePicker === 'function';
const POLL_MS = 4000;
const PALETTE = ['#2a78d6', '#eb6834', '#1baf7a', '#eda100', '#e87ba4', '#008300', '#6250d6', '#e34948', '#8a8984'];
const RULE_BG = ['#fde2e1', '#fde8d9', '#fff4c9', '#dff3df', '#deebfb', '#ebe7fb', '#eeeeec'];
const RULE_FG = ['#b42318', '#9a4a00', '#1e6b1e', '#1c5cab', '#5b3fc4', '#8a8984', '#1d1d1b'];
const TYPES = {
  text: '1行テキスト', longtext: '複数行テキスト', number: '数値', date: '日付',
  select: '選択肢（1つ）', multiselect: '選択肢（複数）', user: '人', checkbox: 'チェックボックス', link: 'リンク（URL）',
};
const SYS_PROP = { no: 'no', createdAt: 'createdAt', createdBy: 'createdBy', updatedAt: 'updatedAt', updatedBy: 'updatedBy' };

/* ---------- utils ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const J = v => (v === undefined ? undefined : JSON.stringify(v));
const clone = o => JSON.parse(JSON.stringify(o));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2)).replace(/-/g, '').slice(0, 16);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const today = () => ymd(new Date());
function addDays(s, n) { const [y, m, d] = s.split('-').map(Number); return ymd(new Date(y, m - 1, d + n)); }
function fmtTime(ms) { if (!ms) return ''; const d = new Date(ms); return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function fmtDateTime(ms) { if (!ms) return ''; const d = new Date(ms); return ymd(d).replace(/-/g, '/') + ' ' + fmtTime(ms); }
function relTime(ms) {
  if (!ms) return '';
  const s = (Date.now() - ms) / 1000;
  if (s < 60) return 'たった今';
  if (s < 3600) return Math.floor(s / 60) + '分前';
  if (s < 86400) return Math.floor(s / 3600) + '時間前';
  if (s < 86400 * 7) return Math.floor(s / 86400) + '日前';
  return fmtDateTime(ms).slice(0, 10);
}
const isEmpty = v => v == null || v === '' || v === false || (Array.isArray(v) && v.length === 0) || (typeof v === 'object' && !Array.isArray(v) && !v.url);
// リンクの値は [{url, title}, …]。古い形式（1件だけのオブジェクト）も配列として扱う
const linksOf = v => (Array.isArray(v) ? v : v && v.url ? [v] : []).filter(l => l && l.url);
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* 保存できない環境では無視 */ } },
};
function toHalf(s) { return String(s).replace(/[０-９．－／：，]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)); }

/* ---------- data model ---------- */
function defaultDoc() {
  // 既定の内容は固定値にしておく（空のファイルを別々に開いた人どうしでもマージできるように）
  return {
    meta: { format: 'kadai-kanri', version: 1, fileId: null, saveId: null, savedAt: null, savedBy: null },
    settings: { id: 'settings', title: '課題管理表', kanbanField: 'status', dueField: 'due', assigneeField: 'assignee', groupField: 'assignee', cardFields: ['assignee', 'due', 'priority'] },
    fields: [
      { id: 'no', name: 'ID', type: 'no', system: true, readonly: true, order: 0, width: 64 },
      { id: 'title', name: '件名', type: 'text', system: true, order: 1, width: 300 },
      { id: 'status', name: 'ステータス', type: 'select', system: true, order: 2, width: 110, options: [
        { id: 's1', label: '未着手', color: '#8a8984' },
        { id: 's2', label: '対応中', color: '#2a78d6' },
        { id: 's3', label: '確認待ち', color: '#eda100' },
        { id: 's4', label: '完了', color: '#008300', done: true },
      ] },
      { id: 'assignee', name: '担当者', type: 'user', order: 3, width: 110 },
      { id: 'due', name: '期限', type: 'date', order: 4, width: 110 },
      { id: 'priority', name: '優先度', type: 'select', order: 5, width: 90, options: [
        { id: 'p1', label: '高', color: '#e34948' },
        { id: 'p2', label: '中', color: '#eda100' },
        { id: 'p3', label: '低', color: '#8a8984' },
      ] },
      { id: 'createdAt', name: '作成日時', type: 'datetime', system: true, readonly: true, hidden: true, order: 90, width: 130 },
      { id: 'createdBy', name: '起票者', type: 'user', system: true, readonly: true, hidden: true, order: 91, width: 100 },
      { id: 'updatedAt', name: '更新日時', type: 'datetime', system: true, readonly: true, hidden: true, order: 92, width: 130 },
      { id: 'updatedBy', name: '更新者', type: 'user', system: true, readonly: true, hidden: true, order: 93, width: 100 },
    ],
    rules: [
      { id: 'r1', name: '期限切れ', enabled: true, order: 0, match: 'all', target: 'row',
        conditions: [{ fieldId: 'due', op: 'overdue' }, { fieldId: 'status', op: 'open' }],
        style: { bg: '#fde2e1', color: '#b42318' } },
      { id: 'r2', name: '期限まで3日以内', enabled: true, order: 1, match: 'all', target: 'row',
        conditions: [{ fieldId: 'due', op: 'withinDays', value: 3 }, { fieldId: 'status', op: 'open' }],
        style: { bg: '#fff4c9' } },
      { id: 'r3', name: '優先度が高い課題は件名を太字に', enabled: true, order: 2, match: 'all', target: 'title',
        conditions: [{ fieldId: 'priority', op: 'is', value: 'p1' }],
        style: { bold: true } },
      { id: 'r4', name: '完了した課題は薄く', enabled: true, order: 3, match: 'all', target: 'row',
        conditions: [{ fieldId: 'status', op: 'closed' }],
        style: { color: '#8a8984' } },
    ],
    issues: [],
  };
}
function normalize(d) {
  const def = defaultDoc();
  d = d && typeof d === 'object' ? d : def;
  d.meta = Object.assign({}, def.meta, d.meta || {});
  d.settings = Object.assign({}, def.settings, d.settings || {}, { id: 'settings' });
  d.fields = Array.isArray(d.fields) ? d.fields : def.fields;
  d.rules = Array.isArray(d.rules) ? d.rules : [];
  d.issues = Array.isArray(d.issues) ? d.issues : [];
  for (const i of d.issues) { if (!i.values) i.values = {}; if (typeof i.rank !== 'number') i.rank = i.no || 0; }
  for (const f of d.fields) if (f.type === 'link') for (const i of d.issues) {
    const v = i.values[f.id];
    if (v != null && !Array.isArray(v)) { if (v.url) i.values[f.id] = [v]; else delete i.values[f.id]; }
  }
  const nf = d.fields.find(f => f.id === 'no');
  if (nf && (!nf.width || nf.width < 96)) nf.width = 100;
  return d;
}

const embeddedText = document.getElementById('issue-data').textContent.trim();
let embedded = null;
try { embedded = JSON.parse(embeddedText); } catch (e) { embedded = null; }
const wasBlank = !embedded;
let doc = normalize(embedded ? clone(embedded) : defaultDoc());
if (!doc.meta.fileId) doc.meta.fileId = uid();
let base = clone(doc);          // 最後にファイルと同期した内容（マージの基準）
let undoStack = [], redoStack = [];

let me = LS.get('kk-user', '');
const prefs = Object.assign({ autosave: true, view: 'table' }, LS.get('kk-prefs', {}));
const ui = {
  view: prefs.view || 'table', search: '', quick: 'all', filters: {},
  sort: { fid: null, dir: 1 }, sel: null, editing: null, rowIds: [], colIds: [], ltOpen: new Map(),
};
const file = { handle: null, name: '', lastModified: 0, perm: false, saving: false, again: false, pendingRemote: null, error: '' };
let storedHandle = null;
const collapsedKey = () => 'kk-collapsed-' + doc.meta.fileId;
let collapsedParents = new Set(LS.get(collapsedKey(), []));
const saveCollapsed = () => LS.set(collapsedKey(), [...collapsedParents]);
// 複数行テキスト：列ごとの既定（全行／1行）と、セルごとの切り替え
function ltCollapsed(iid, fid) {
  const k = iid + ':' + fid;
  if (ui.ltOpen.has(k)) return ui.ltOpen.get(k);
  return !!(prefs.ltCollapsed || {})[fid];
}

const activeFields = () => doc.fields.filter(f => !f.deleted).sort((a, b) => a.order - b.order);
const visibleFields = () => activeFields().filter(f => !f.hidden);
const fieldById = id => doc.fields.find(f => f.id === id && !f.deleted);
const activeIssues = () => doc.issues.filter(i => !i.deleted);
const issueById = id => doc.issues.find(i => i.id === id);
const optById = (f, id) => (f.options || []).find(o => o.id === id);
const activeRules = () => doc.rules.filter(r => !r.deleted).sort((a, b) => a.order - b.order);
const getVal = (i, f) => (SYS_PROP[f.id] ? i[SYS_PROP[f.id]] : i.values[f.id]);
const docBody = d => JSON.stringify({ s: d.settings, f: d.fields, r: d.rules, i: d.issues });
const isDirty = () => docBody(doc) !== docBody(base);
const nextNo = () => doc.issues.reduce((m, i) => Math.max(m, i.no || 0), 0) + 1;

function fmt(f, v) {
  if (isEmpty(v) && f.type !== 'number') return '';
  if (v == null || v === '') return '';
  switch (f.type) {
    case 'no': return '#' + v;
    case 'select': { const o = optById(f, v); return o ? o.label : ''; }
    case 'multiselect': return v.map(id => (optById(f, id) || {}).label).filter(Boolean).join(', ');
    case 'checkbox': return v ? '✓' : '';
    case 'date': return String(v).replace(/-/g, '/');
    case 'datetime': return fmtDateTime(v);
    case 'number': return Number(v).toLocaleString('ja-JP', { maximumFractionDigits: 10 });
    case 'link': return linksOf(v).map(linkLabel).join(', ');
    default: return String(v);
  }
}
/* ---------- リンク ---------- */
function safeHref(u) { const s = String(u || '').trim(); return /^(https?:|mailto:|file:)/i.test(s) ? s : null; }
const linkLabel = l => l.title || linkDomain(l.url);
// タイトルが取れなかったときの表示名：ドメイン（スキーマの後から最初の / まで）
function linkDomain(u) {
  const s = String(u || '').trim();
  const m = s.match(/^[a-z][\w+.-]*:\/\/([^\/?#]*)/i);
  if (m && m[1]) return m[1];
  if (/^mailto:/i.test(s)) return s.slice(7).split('?')[0];
  // file:///C:/… のようにドメインがない場合は、ファイル名を表示する
  try { const p = decodeURIComponent(new URL(s).pathname).split('/').filter(Boolean); return p[p.length - 1] || s; } catch (e) { return s; }
}
function parseLinkText(raw) {
  const t = String(raw || '').trim();
  if (!t) return null;
  const m = t.match(/^(.*?)[\s(（<「]*((?:https?:\/\/|mailto:|file:)[^\s)）>」]+)[\s)）>」]*(.*)$/i);
  if (m) { const title = (m[1] + ' ' + m[3]).trim(); return { url: m[2], title: title === m[2] ? '' : title }; }
  if (/^\\\\[^\\]/.test(t)) return { url: 'file:' + t.replace(/\\/g, '/'), title: '' };   // \\server\share
  if (/^[\w-]+(\.[\w-]+)+(:\d+)?(\/\S*)?$/.test(t) && !/^\d+(\.\d+)*$/.test(t)) return { url: 'https://' + t, title: '' };
  return null;
}
// 複数のリンクを含む文字列（1行に1つ、または空白区切りのURL）を読み取る
function parseLinksText(raw) {
  const out = [];
  for (const line of String(raw || '').split(/\r?\n|\s*[、,]\s*(?=(?:https?:\/\/|mailto:|file:))/i)) {
    if (!line.trim()) continue;
    const urls = line.match(/(?:https?:\/\/|mailto:|file:)[^\s)）>」]+/gi) || [];
    if (urls.length > 1 && !line.replace(/(?:https?:\/\/|mailto:|file:)[^\s)）>」]+/gi, '').trim()) urls.forEach(u => out.push({ url: u, title: '' }));
    else { const l = parseLinkText(line); if (!l) return null; out.push(l); }
  }
  return out;
}
// ドラッグ＆ドロップや貼り付けのデータから、リンク（とページのタイトル）を取り出す。複数あればすべて
function linksFromData(dt, richOnly) {
  if (!dt) return [];
  const html = dt.getData('text/html');
  if (html) {
    const as = [...new DOMParser().parseFromString(html, 'text/html').querySelectorAll('a[href]')].filter(a => safeHref(a.getAttribute('href')));
    if (as.length) return as.map(a => { const href = a.getAttribute('href'), text = (a.textContent || '').trim().replace(/\s+/g, ' '); return { url: href, title: text === href ? '' : text }; });
  }
  const uris = (dt.getData('text/uri-list') || '').split(/\r?\n/).filter(x => x && !x.startsWith('#'));
  if (uris.length) return uris.map(u => ({ url: u, title: '' }));
  if (richOnly) return [];
  // Excel のセル内改行は "…" で囲まれて来るので、外してから読む
  const g = parseDelimited(String(dt.getData('text/plain') || '').replace(/\r?\n$/, ''), '\t');
  if (g.length !== 1 || g[0].length !== 1) return [];
  return parseLinksText(g[0][0]) || [];
}
// 既存のリンクに追加する（同じURLは追加しない）
function addLinks(cur, add) {
  const out = linksOf(cur).map(l => Object.assign({}, l));
  for (const l of add) if (!out.some(x => x.url === l.url)) out.push(l);
  return out;
}
async function fetchTitle(url) {
  if (!/^https?:/i.test(url)) return null;
  try {
    const ctl = new AbortController();
    const tm = setTimeout(() => ctl.abort(), 6000);
    const r = await fetch(url, { mode: 'cors', credentials: 'omit', signal: ctl.signal });
    clearTimeout(tm);
    if (!r.ok || !/html/i.test(r.headers.get('content-type') || '')) return null;
    const buf = await r.arrayBuffer();
    let cs = ((r.headers.get('content-type') || '').match(/charset=([\w-]+)/i) || [])[1];
    if (!cs) cs = ((new TextDecoder('latin1').decode(buf.slice(0, 4096))).match(/<meta[^>]+charset=["']?([\w-]+)/i) || [])[1] || 'utf-8';
    let html;
    try { html = new TextDecoder(cs).decode(buf); } catch (e) { html = new TextDecoder('utf-8').decode(buf); }
    const d = new DOMParser().parseFromString(html, 'text/html');
    const og = d.querySelector('meta[property="og:title"]');
    const t = ((og && og.getAttribute('content')) || d.title || '').trim().replace(/\s+/g, ' ');
    return t || null;
  } catch (e) { return null; }
}
const titleCache = new Map();
function getTitle(url) { if (!titleCache.has(url)) titleCache.set(url, fetchTitle(url)); return titleCache.get(url); }
// タイトルが空のリンクについて、ページのタイトルを取りに行く（取れたら自動で入れる）
function queueTitles() {
  const lf = activeFields().filter(f => f.type === 'link');
  if (!lf.length) return;
  const urls = new Set();
  for (const i of activeIssues()) for (const f of lf) for (const l of linksOf(i.values[f.id])) if (!l.title && /^https?:/i.test(l.url) && !titleCache.has(l.url)) urls.add(l.url);
  for (const u of urls) getTitle(u).then(t => {
    if (!t) return;
    let ch = false;
    for (const i of activeIssues()) for (const f of lf) for (const l of linksOf(i.values[f.id])) if (l.url === u && !l.title) { l.title = t; touch(i); ch = true; }
    if (ch && !ui.editing) changed();
  });
}
const displayText = (i, f) => fmt(f, getVal(i, f));
const byRank = (a, b) => (a.rank - b.rank) || (a.no - b.no);

/* ---------- 親子（2階層） ---------- */
function treeInfo() {
  const all = activeIssues();
  const byId = new Map(all.map(i => [i.id, i]));
  const hasLiveParent = i => !!(i.parent && i.parent !== i.id && byId.has(i.parent));
  // 親が見つからない・親自身にも親がいる（3階層目）の場合は最上位として扱う
  const parentOf = i => { if (!hasLiveParent(i)) return null; const p = byId.get(i.parent); return hasLiveParent(p) ? null : p; };
  const kids = new Map();
  for (const i of all) { const p = parentOf(i); if (p) { if (!kids.has(p.id)) kids.set(p.id, []); kids.get(p.id).push(i); } }
  return { all, byId, parentOf, kids };
}
function groupSibs(i, t = treeInfo()) {
  const p = t.parentOf(i);
  return (p ? (t.kids.get(p.id) || []) : t.all.filter(x => !t.parentOf(x))).filter(x => x.id !== i.id).sort(byRank);
}
function placeAt(i, sibs, idx) {
  const prev = sibs[idx - 1], next = sibs[idx];
  i.rank = prev && next ? (prev.rank + next.rank) / 2 : prev ? prev.rank + 1 : next ? next.rank - 1 : 0;
}
function pill(o) { return `<span class="pill" style="--c:${esc(o.color || '#8a8984')}">${esc(o.label)}</span>`; }

function statusField() { return fieldById('status'); }
function isOpen(i) { const f = statusField(); if (!f) return true; const o = optById(f, i.values.status); return !(o && o.done); }

/* ---------- 絞り込み・並べ替え ---------- */
function filterKeys(i, f) {
  const v = getVal(i, f);
  if (f.type === 'multiselect') { const ls = (v || []).map(id => (optById(f, id) || {}).label).filter(Boolean); return ls.length ? ls : ['']; }
  if (f.type === 'link') { const ls = linksOf(v).map(linkLabel); return ls.length ? ls : ['']; }
  if (f.type === 'datetime') return [v ? ymd(new Date(v)).replace(/-/g, '/') : ''];
  return [fmt(f, v)];
}
function sortKey(i, f) {
  const v = getVal(i, f);
  if (isEmpty(v) && f.type !== 'checkbox') return null;
  switch (f.type) {
    case 'select': return (f.options || []).findIndex(o => o.id === v);
    case 'multiselect': return Math.min(...v.map(id => (f.options || []).findIndex(o => o.id === id)));

    case 'checkbox': return v ? 1 : 0;
    case 'link': return fmt(f, v);
    default: return String(v);
  }
}
function cmpIssues(a, b) {
  if (!ui.sort.fid) return byRank(a, b);
  const f = fieldById(ui.sort.fid) || fieldById('no');
  const x = sortKey(a, f), y = sortKey(b, f);
  if (x === null && y === null) return byRank(a, b);
  if (x === null) return 1;
  if (y === null) return -1;
  const c = typeof x === 'number' && typeof y === 'number' ? x - y : String(x).localeCompare(String(y), 'ja');

  const tops = t.all.filter(i => !t.parentOf(i)).sort(cmpIssues);
  const rows = [];
  for (const T of tops) {
    const ks = (t.kids.get(T.id) || []).slice().sort(cmpIssues);
    const mk = ks.filter(k => m.has(k.id));
    if (!m.has(T.id) && !mk.length) continue;
    const collapsed = !expandAll && ks.length > 0 && collapsedParents.has(T.id);
    rows.push({ i: T, depth: 0, ctx: !m.has(T.id), kids: ks, collapsed });

  if (f.type === 'number') ed.inputMode = 'decimal';

/* 日本語入力の受け口：選択中のセルの上に見えない入力欄を置き、変換が始まったらそのまま編集欄にする */

function openChoice(anchor, i, f, initial) {

  const pop = openPopover(anchor, `<input class="pop-search" placeholder="${isUser ? '名前を検索・入力' : '検索 または 新しい選択肢を入力'}"><div class="pop-list" role="listbox"></div>${multi ? '<div class="pop-foot"><button class="btn sm primary" data-k="done">決定</button></div>' : ''}`, { minWidth: Math.max(anchor.offsetWidth, 220), onClose: () => finish(true) });

  });

/* ---------- リンクの編集（複数） ---------- */
// box に複数リンクの入力欄を作る。value() で {links, bad} を返す
function linkEditor(box, links, { focus } = {}) {
  let rows = linksOf(links).map(l => ({ url: l.url, title: l.title || '', touched: !!l.title, st: '' }));
  rows.push({ url: '', title: '', touched: false, st: '' });
  const blank = () => ({ url: '', title: '', touched: false, st: '' });

    box.innerHTML = '<div class="le">' + rows.map((r, n) => `<div class="le-row"><div class="le-in"><input class="inp le-url" data-n="${n}" placeholder="https://…（リンクの貼り付け・ドラッグもできます）" value="${esc(r.url)}"><input class="inp le-title" data-n="${n}" placeholder="表示する名前（空欄ならページのタイトルを自動で取得）" value="${esc(r.title)}"><div class="hint le-st" data-n="${n}">${esc(r.st)}</div></div><button type="button" class="iconbtn" data-le="del" data-n="${n}" aria-label="このリンクを削除" data-tip="このリンクを削除">×</button></div>`).join('') + '<button type="button" class="btn sm" data-le="add">＋ リンクを追加</button></div>';
    if (focusN != null) { const el = box.querySelector(`.le-url[data-n="${focusN}"]`); if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); } }
  }
  const setSt = (n, t) => { rows[n].st = t; const el = box.querySelector(`.le-st[data-n="${n}"]`); if (el) el.textContent = t; };

    const r = rows[n]; if (!r) return;
    const l = parseLinkText(r.url);
    if (!l) { setSt(n, r.url.trim() ? 'URLとして読み取れません' : ''); return; }
    if (l.title && !r.touched) { r.title = l.title; r.touched = true; const ti = box.querySelector(`.le-title[data-n="${n}"]`); if (ti) ti.value = l.title; }
    if (r.touched || !/^https?:/i.test(l.url)) return;
    setSt(n, 'ページのタイトルを取得しています…');
    const t = await getTitle(l.url);
    if (rows[n] !== r || r.touched) return;
    if (t) { r.title = t; const ti = box.querySelector(`.le-title[data-n="${n}"]`); if (ti) ti.value = t; setSt(n, ''); }

    const keep = rows.filter((r, k) => k !== n && r.url.trim());
    const fresh = ls.filter(l => !keep.some(r => r.url === l.url)).map(l => ({ url: l.url, title: l.title || '', touched: !!l.title, st: '' }));
    rows = keep.concat(fresh, [blank()]);
    draw(rows.length - 1);
    rows.forEach((r, k) => { if (r.url && !r.touched) tryFetch(k); });
  }
  box.addEventListener('input', e => {
    const n = +e.target.dataset.n; if (!rows[n]) return;
    if (e.target.classList.contains('le-url')) rows[n].url = e.target.value;
    if (e.target.classList.contains('le-title')) { rows[n].title = e.target.value; rows[n].touched = !!e.target.value.trim(); if (rows[n].touched) setSt(n, ''); }
  });

    const b = e.target.closest('[data-le]'); if (!b) return;

    if (b.dataset.le === 'del') { rows.splice(+b.dataset.n, 1); if (!rows.length || rows[rows.length - 1].url.trim()) rows.push(blank()); draw(Math.min(+b.dataset.n, rows.length - 1)); }

        if (!r.url.trim()) continue;
        const l = parseLinkText(r.url);

  };
}

/* ---------- 行の操作（並べ替え・親子） ---------- */
function ensureManual() {
  if (!ui.sort.fid) return false;
  ui.sort = { fid: null, dir: 1 };
  toast('並べ替えを解除して、手動の並び順に戻しました');
  return true;
}
function moveRow(iid, d) {
  const i = issueById(iid); if (!i) return;
  if (ensureManual()) { renderAll(); }
  const sibs = groupSibs(i);
  const all = sibs.concat([i]).sort(byRank);
  const n = all.indexOf(i), m = n + d;
  if (m < 0 || m >= all.length) return;
  mutate(() => { placeAt(i, sibs, m); });   // sibs は自分を除いた並びなので、m 番目に入れればよい
}
function indentRow(iid) {
  const i = issueById(iid); if (!i) return;
  const t = treeInfo();
  if (t.parentOf(i)) return toast('すでに子の課題です（2階層まで）');
  if ((t.kids.get(i.id) || []).length) return toast('子の課題を持っているため、他の課題の子にはできません（2階層まで）', true);
  ensureManual();
  const tops = t.all.filter(x => !t.parentOf(x)).sort(byRank);
  const n = tops.indexOf(i);
  if (n <= 0) return toast('上に課題がないため、子にできません');
  const np = tops[n - 1];
  mutate(() => { i.parent = np.id; const ks = (t.kids.get(np.id) || []).sort(byRank); placeAt(i, ks, ks.length); touch(i); });
  collapsedParents.delete(np.id); saveCollapsed(); renderView();
}
function outdentRow(iid) {
  const i = issueById(iid); if (!i) return;
  const t = treeInfo();
  const p = t.parentOf(i);
  if (!p) return toast('最上位の課題です');
  ensureManual();
  const tops = t.all.filter(x => !t.parentOf(x)).sort(byRank);
  mutate(() => { delete i.parent; placeAt(i, tops, tops.indexOf(p) + 1); touch(i); });
}
function addChild(pid) {
  const t = treeInfo();
  let p = issueById(pid); if (!p) return;
  if (t.parentOf(p)) p = t.parentOf(p);
  let id;
  mutate(() => { id = newIssue({}, p.id).id; });
  collapsedParents.delete(p.id); saveCollapsed();
  if (ui.view !== 'table') { openForm(id); return; }
  renderView();

}

// 行のドラッグで並べ替え（子の課題にする／親から外すこともできる）
function startRowDrag(iid, e0) {
  if (ui.sort.fid) { ensureManual(); renderAll(); }
  const i = issueById(iid); if (!i) return;
  const t = treeInfo();
  const hasKids = (t.kids.get(iid) || []).length > 0;
  const wrap = $('#tableWrap');
  const line = document.createElement('div'); line.className = 'drop-line'; document.body.appendChild(line);
  const trOf = id => main.querySelector(`tr[data-iid="${id}"]`);
  const block = id => { const out = [id]; let n = ui.rowIds.indexOf(id) + 1; while (n < ui.rowIds.length && t.parentOf(issueById(ui.rowIds[n])) && t.parentOf(issueById(ui.rowIds[n])).id === id) out.push(ui.rowIds[n++]); return out; };
  block(iid).forEach(id => { const tr = trOf(id); if (tr) tr.classList.add('dragging'); });
  document.body.classList.add('row-dragging');
  let target = null, moved = false;
  const show = (y, indent) => { const w = wrap.getBoundingClientRect(); line.style.display = 'block'; line.style.top = (y - 1) + 'px'; line.style.left = (w.left + (indent ? 140 : 8)) + 'px'; line.style.width = Math.max(80, w.width - (indent ? 150 : 18)) + 'px'; };
  const mv = ev => {
    if (!moved && Math.abs(ev.clientY - e0.clientY) < 4) return;
    moved = true;
    const w = wrap.getBoundingClientRect();
    if (ev.clientY < w.top + 48) wrap.scrollTop -= 14; else if (ev.clientY > w.bottom - 30) wrap.scrollTop += 14;
    const el = document.elementFromPoint(Math.min(Math.max(ev.clientX, w.left + 4), w.right - 4), ev.clientY);
    const tr = el && el.closest('tr[data-iid]');
    target = null; line.style.display = 'none';
    if (!tr || !wrap.contains(tr)) return;
    const R = issueById(tr.dataset.iid); if (!R || R.id === i.id) return;
    const rect = tr.getBoundingClientRect(), upper = ev.clientY < rect.top + rect.height / 2;
    const Rp = t.parentOf(R);
    if (Rp) {
      if (Rp.id === i.id) return;
      if (hasKids) { const b = block(Rp.id); target = { parent: null, ref: Rp, pos: 'after' }; show(trOf(b[b.length - 1]).getBoundingClientRect().bottom, false); }
      else { target = { parent: Rp.id, ref: R, pos: upper ? 'before' : 'after' }; show(upper ? rect.top : rect.bottom, true); }
      return;
    }
    const rk = t.kids.get(R.id) || [];
    if (upper) { target = { parent: null, ref: R, pos: 'before' }; show(rect.top, false); }
    else if (!hasKids && (rk.length && !collapsedParents.has(R.id) || ev.clientX > rect.left + 220)) { target = { parent: R.id, ref: null, pos: 'first' }; show(rect.bottom, true); }
    else { const b = block(R.id); target = { parent: null, ref: R, pos: 'after' }; show(trOf(b[b.length - 1]).getBoundingClientRect().bottom, false); }
  };
  const end = ev => {
    document.removeEventListener('mousemove', mv); document.removeEventListener('mouseup', end); document.removeEventListener('keydown', esc_, true);
    line.remove(); document.body.classList.remove('row-dragging');
    $$('tr.dragging', main).forEach(tr => tr.classList.remove('dragging'));
    if (!ev || !target) return;
    const res = target;
    mutate(() => {
      const before = i.parent || null;
      if (res.parent) i.parent = res.parent; else delete i.parent;
      const sibs = groupSibs(i, treeInfo());
      const idx = res.pos === 'first' ? 0 : sibs.indexOf(res.ref) + (res.pos === 'after' ? 1 : 0);
      placeAt(i, sibs, idx);
      if ((i.parent || null) !== before) touch(i);
    });
    if (res.parent) { collapsedParents.delete(res.parent); saveCollapsed(); renderView(); }
  };
  const esc_ = ev => { if (ev.key === 'Escape') { ev.stopPropagation(); target = null; end(null); } };
  document.addEventListener('mousemove', mv); document.addEventListener('mouseup', end); document.addEventListener('keydown', esc_, true);
}

/* ---------- コピー・貼り付け ---------- */
function pasteGrid(text) {
  const rows = parseDelimited(text, text.includes('\t') ? '\t' : ',');
  if (!rows.length) return;
  if (!activeIssues().length || !ui.sel) {
    // 空の表への貼り付けは取り込み画面へ
    return openImport(text);
  }
  let r0 = ui.rowIds.indexOf(ui.sel.iid), c0 = ui.colIds.indexOf(ui.sel.fid);
  if (r0 < 0 || c0 < 0) return;
  let bad = 0, created = 0;
  mutate(() => {
    rows.forEach((cells, dr) => {
      let iid = ui.rowIds[r0 + dr];
      let iss = iid ? issueById(iid) : null;
      if (!iss) { iss = newIssue({}); created++; }
      const patch = {};
      cells.forEach((cell, dc) => {
        const f = fieldById(ui.colIds[c0 + dc]);

}

/* ---------- ダッシュボード ---------- */
function renderDash() {
  const all = activeIssues(), open = all.filter(isOpen);
  const dueF = fieldById(doc.settings.dueField);
  const overdue = dueF ? open.filter(isOverdue) : [], soon = dueF ? open.filter(isDueSoon) : [];
  const tile = (q, label, n, sub, tone) => `<button class="tile ${tone || ''}" data-quick-go="${q}"><div class="t-label">${tone ? `<span class="sicon ${tone}">!</span>` : ''}${label}</div><div class="t-num">${n}</div><div class="t-sub">${sub}</div></button>`;

  h += tile('open', '未完了', open.length, `全${all.length}件中`);

  h += '</div><div class="cards2">';

  // ステータス別
  const sf = statusField();
  if (sf) {
    const counts = (sf.options || []).map(o => ({ o, n: all.filter(i => i.values.status === o.id).length }));
    const none = all.filter(i => !optById(sf, i.values.status)).length;
    if (none) counts.push({ o: { label: '未設定', color: '#cfcdc6' }, n: none });
    const max = Math.max(1, ...counts.map(c => c.n));
    h += `<section class="card"><h3>ステータス別</h3><div class="bars">` + counts.map(c => `<div class="bar-row" data-tip="${esc(c.o.label)}: ${c.n}件（${all.length ? Math.round(c.n / all.length * 100) : 0}%）"><span class="bar-label">${esc(c.o.label)}</span><div class="bar-track"><div class="bar-seg" style="width:${c.n / max * 100}%;background:${esc(c.o.color)};border-radius:0 4px 4px 0;${c.n ? '' : 'min-width:0'}"></div></div><span class="bar-val">${c.n}</span></div>`).join('') + '</div></section>';
  }

  // 項目ごとの未完了の内訳
  const groupable = activeFields().filter(f => (f.type === 'select' || f.type === 'user') && f.id !== 'status' && !SYS_PROP[f.id]);
  const gf = fieldById(doc.settings.groupField) && groupable.find(f => f.id === doc.settings.groupField) ? fieldById(doc.settings.groupField) : groupable[0];
  if (gf && sf) {

    const g = new Map();
    for (const i of open) { const k = keyOf(i); if (!g.has(k)) g.set(k, []); g.get(k).push(i); }
    let rows = Array.from(g.entries()).sort((a, b) => b[1].length - a[1].length);
    const max = Math.max(1, ...rows.map(r => r[1].length));
    const sel = `<select class="sel" id="groupField">${groupable.map(f => `<option value="${esc(f.id)}"${f.id === gf.id ? ' selected' : ''}>${esc(f.name)}</option>`).join('')}</select>`;
    h += `<section class="card"><h3>${sel} ごとの未完了</h3>`;
    if (!rows.length) h += '<p class="muted">未完了の課題はありません。</p>';

      if (openOpts.length > 1) h += '<div class="legend">' + openOpts.map(o => `<span><i style="--c:${esc(o.color)}"></i>${esc(o.label)}</span>`).join('') + '</div>';

        const other = items.length - segs.reduce((a, s) => a + s.n, 0);

      }).join('') + '</div>';

    }

    h += '</section>';
  }

  h += '</section></div></div>';
  main.innerHTML = h;
}

let activePop = null;
function openPopover(anchor, html, { minWidth, onClose, align } = {}) {
  closePopover();

  if (minWidth) p.style.minWidth = minWidth + 'px';

  p.style.left = left + 'px'; p.style.top = top + 'px';
  p._onClose = onClose;
  activePop = p;
  return p;
}
function closePopover() {

}

const openModals = [];
function openModal({ title, body, foot, wide, closable = true, onClose }) {
  const ov = document.createElement('div');
  ov.className = 'overlay';
  ov.innerHTML = `<div class="modal${wide ? ' wide' : ''}" role="dialog" aria-modal="true"><div class="modal-h"><h2>${esc(title)}</h2>${closable ? '<button class="modal-x" data-close aria-label="閉じる">×</button>' : ''}</div><div class="modal-b">${body}</div>${foot ? `<div class="modal-f">${foot}</div>` : ''}</div>`;
  document.body.appendChild(ov);
  const m = ov.firstElementChild;
  m._ov = ov; m._onClose = onClose; m._closable = closable;
  openModals.push(m);
  ov.addEventListener('mousedown', e => { if (e.target === ov && closable) ov._down = true; });
  ov.addEventListener('click', e => { if (e.target === ov && ov._down && closable) closeModal(m); ov._down = false; });
  m.addEventListener('click', e => { if (e.target.closest('[data-close]')) closeModal(m); });
  setTimeout(() => { const f = m.querySelector('[autofocus]') || m.querySelector('.modal-b input:not([type=checkbox]):not([type=radio]),.modal-b textarea,.modal-b select'); if (f) f.focus(); }, 0);
  return m;
}
function closeModal(m) {
  const k = openModals.indexOf(m);
  if (k >= 0) openModals.splice(k, 1);
  m._ov.remove();
  if (m._onClose) m._onClose();
  if (!openModals.length && file.pendingRemote && !isDirty()) receiveRemote(file.pendingRemote);
}
function alertModal(title, text) {
  const m = openModal({ title, body: `<p style="margin:0;white-space:pre-wrap">${esc(text)}</p>`, foot: '<button class="btn primary" data-close autofocus>OK</button>' });
  setTimeout(() => $('[data-close].btn', m) && $('[data-close].btn', m).focus(), 0);
}
function confirmModal(title, text, okLabel = 'OK', altLabel) {
  return new Promise(res => {
    let done = false;
    const m = openModal({
      title, body: `<p style="margin:0;white-space:pre-wrap">${esc(text)}</p>`,
      foot: `<button class="btn" data-close>キャンセル</button>${altLabel ? `<button class="btn" data-k="alt">${esc(altLabel)}</button>` : ''}<button class="btn primary" data-k="ok">${esc(okLabel)}</button>`,
      onClose: () => { if (!done) res(altLabel ? null : false); },
    });
    m.addEventListener('click', e => {

    });

  });
}

    case 'select': return `<select class="sel" ${n}><option value="">（空欄）</option>${(f.options || []).map(o => `<option value="${esc(o.id)}"${o.id === v ? ' selected' : ''}>${esc(o.label)}</option>`).join('')}<option value="__new">＋ 新しい選択肢…</option></select>`;
    case 'multiselect': return `<div class="ms" data-name="${esc(name)}">${(f.options || []).map(o => `<label><input type="checkbox" value="${esc(o.id)}"${(v || []).includes(o.id) ? ' checked' : ''}>${pill(o)}</label>`).join('')}<button type="button" class="btn sm ghost" data-k="msadd" data-fid="${esc(f.id)}">＋ 追加</button></div>`;

}
function openForm(iid, preset = {}, opts = {}) {
  const editing = iid ? issueById(iid) : null;
  const t = treeInfo();
  const myKids = editing ? (t.kids.get(editing.id) || []).slice().sort(byRank) : [];
  const curParent = editing ? (t.parentOf(editing) || {}).id || '' : (opts.parent || '');
  const fields = activeFields().filter(f => !f.readonly);
  const vals = editing ? clone(editing.values) : Object.assign({}, preset);
  if (!editing && vals.status == null) { const st = statusField(); if (st && st.options[0]) vals.status = st.options[0].id; }
  const added = {};  // フォーム内で追加した選択肢 {fid: [label]}
  let body = `<datalist id="dl-users">${knownUsers().map(n => `<option value="${esc(n)}">`).join('')}</datalist><form class="frm" id="issueForm" onsubmit="return false">`;
  for (const f of fields) body += `<label class="${f.id === 'title' ? 'req' : ''}">${esc(f.name)}</label><div>${inputHtml(f, vals[f.id], 'f_' + f.id)}</div>`;
  const parentOpts = t.all.filter(x => !t.parentOf(x) && (!editing || x.id !== editing.id)).sort(byRank);
  body += `<label>親の課題</label><div>${myKids.length ? '<div class="ro-val">この課題は子の課題を持っているため、他の課題の子にはできません（2階層まで）。</div>' : `<select class="sel" name="__parent" style="max-width:100%"><option value="">（なし：最上位の課題）</option>${parentOpts.map(x => `<option value="${x.id}"${x.id === curParent ? ' selected' : ''}>#${x.no} ${esc((x.values.title || '').slice(0, 50))}</option>`).join('')}</select>`}</div>`;
  if (editing && !curParent) body += `<label>子の課題</label><div><div class="kid-list">${myKids.map(k => { const o = optById(statusField() || {}, k.values.status); return `<button type="button" data-k="kid" data-iid="${k.id}"><span class="muted">#${k.no}</span>${o ? pill(o) : ''}<span>${esc(k.values.title || '（件名なし）')}</span></button>`; }).join('') || '<span class="muted">まだありません</span>'}</div><button type="button" class="btn sm" data-k="addkid">＋ 子の課題を追加</button></div>`;
  if (editing) body += `<label>記録</label><div class="ro-val">#${editing.no} ・ 作成 ${esc(fmtDateTime(editing.createdAt))} ${esc(editing.createdBy || '')} ・ 更新 ${esc(fmtDateTime(editing.updatedAt))} ${esc(editing.updatedBy || '')}</div>`;
  body += '</form>';
  const foot = `${editing ? '<div class="left"><button class="btn danger" data-k="del">削除</button></div>' : ''}<button class="btn" data-close>キャンセル</button>${editing ? '' : '<button class="btn" data-k="next" data-tip="保存して、続けて次の課題を入力">保存して次へ</button>'}<button class="btn primary" data-k="ok" data-tip="Ctrl+Enter">保存</button>`;
  const m = openModal({ title: editing ? `#${editing.no} を編集` : (curParent ? `新しい子の課題（#${(issueById(curParent) || {}).no} の下）` : '新しい課題'), body, foot, wide: true });
  const form = $('#issueForm', m);
  setTimeout(() => { const t = form.querySelector('[name=f_title]'); if (t) t.focus(); }, 0);
  form.addEventListener('change', e => {
    if (e.target.tagName === 'SELECT' && e.target.value === '__new') {
      const fid = e.target.name.slice(2);
      const label = (prompt('新しい選択肢の名前') || '').trim();
      if (!label) { e.target.value = ''; return; }
      (added[fid] = added[fid] || []).push(label);
      const o = document.createElement('option'); o.value = 'new:' + label; o.textContent = label;
      e.target.insertBefore(o, e.target.lastElementChild); e.target.value = o.value;
    }
  });
  form.addEventListener('click', e => {
    if (e.target.dataset.k === 'msadd') {
      const fid = e.target.dataset.fid;
      const label = (prompt('新しい選択肢の名前') || '').trim();
      if (!label) return;
      (added[fid] = added[fid] || []).push(label);
      const lb = document.createElement('label'); lb.innerHTML = `<input type="checkbox" value="new:${esc(label)}" checked>${pill({ label, color: PALETTE[((fieldById(fid).options || []).length + added[fid].length - 1) % PALETTE.length] })}`;
      e.target.before(lb);
    }
  });
  const linkEds = {};
  for (const f of fields) if (f.type === 'link') linkEds[f.id] = linkEditor(form.querySelector(`.link-in[data-name="f_${CSS.escape(f.id)}"]`), vals[f.id]);
  function collect() {
    const out = {};
    for (const f of fields) {
      if (f.type === 'link') { out[f.id] = linkEds[f.id].value(); continue; }
      if (f.type === 'multiselect') { out[f.id] = $$(`.ms[data-name="f_${CSS.escape(f.id)}"] input:checked`, form).map(x => x.value); continue; }
      const el = form.querySelector(`[name="f_${CSS.escape(f.id)}"]`);
      if (!el) continue;
      out[f.id] = f.type === 'checkbox' ? el.checked : el.value;
    }
    return out;
  }
  function submit(next) {
    const raw = collect();
    if (!String(raw.title || '').trim()) { toast('件名を入力してください', true); form.querySelector('[name=f_title]').focus(); return; }
    let bad = [];
    let newNo = null;
    mutate(() => {
      const patch = {};
      for (const f of fields) {
        let v = raw[f.id];
        const fld = fieldById(f.id);
        const res = id => (typeof id === 'string' && id.startsWith('new:') ? (findOption(fld, id.slice(4)) || { id: addOption(fld, id.slice(4)) }).id : id);
        if (f.type === 'select') { patch[f.id] = v ? res(v) : null; continue; }
        if (f.type === 'multiselect') { patch[f.id] = v.map(res); continue; }
        if (f.type === 'checkbox') { patch[f.id] = v; continue; }
        if (f.type === 'link') {
          if (v.bad.length) bad.push(`${f.name}（${v.bad.join('、')}）`);
          patch[f.id] = v.links.length ? v.links : null; continue;
        }
        const c = convertInput(fld, v, false);
        if (c.ok) patch[f.id] = c.value; else bad.push(f.name);
      }
      const ps = form.querySelector('[name=__parent]');
      const np = ps ? ps.value : curParent;
      if (editing) {
        const iss = issueById(editing.id);
        if (iss) {
          setValuesIn(iss, patch);
          if ((iss.parent || '') !== np && ps) {
            if (np) iss.parent = np; else delete iss.parent;
            const sibs = groupSibs(iss); placeAt(iss, sibs, sibs.length); touch(iss);
          }
        }
      } else newNo = newIssue(patch, np || undefined).no;
      if (np) collapsedParents.delete(np);
    });
    saveCollapsed();
    if (bad.length) toast(`読み取れなかった項目: ${bad.join('、')}`, true);
    closeModal(m);
    if (next) openForm(null, preset, opts);
    if (newNo) toast(`#${newNo} を登録しました`);
  }
  m.addEventListener('click', async e => {
    const k = (e.target.closest('[data-k]') || {}).dataset ? e.target.closest('[data-k]').dataset.k : undefined;
    if (k === 'ok') submit(false);
    if (k === 'next') submit(true);
    if (k === 'del' && await deleteIssue(editing.id)) closeModal(m);
    if (k === 'kid') openForm(e.target.closest('[data-iid]').dataset.iid);
    if (k === 'addkid') openForm(null, {}, { parent: editing.id });
  });
  m.addEventListener('keydown', e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); submit(false); } });
}

function openFields() {
  const m = openModal({ title: '項目の管理', wide: true, body: '<div id="fl"></div>', foot: '<div class="left"><button class="btn" data-k="add">＋ 項目を追加</button></div><button class="btn primary" data-close>閉じる</button>' });

  }
  draw();
  m.addEventListener('click', async e => {
    const k = e.target.dataset.k, fid = e.target.dataset.fid;
    if (k === 'add') openFieldEditor(null, draw);
    if (k === 'edit') openFieldEditor(fid, draw);
    if (k === 'up' || k === 'down') { moveField(fid, k === 'up' ? -1 : 1); draw(); }
    if (k === 'del') { const f = fieldById(fid); if (await confirmModal('項目を削除', `項目「${f.name}」を削除しますか？\nこの項目に入力された内容は表示されなくなります。`, '削除する')) { deleteField(fid); draw(); } }
  });

}
function moveField(fid, d, list) {
  mutate(() => {
    const fs = activeFields();
    const seq = list || fs;
    const n = seq.findIndex(f => f.id === fid), t = n + d;
    if (n < 0 || t < 0 || t >= seq.length) return;
    const a = fs.indexOf(seq[n]), b = fs.indexOf(seq[t]);
    [fs[a], fs[b]] = [fs[b], fs[a]];
    fs.forEach((f, k) => { if (f.order !== k) f.order = k; });
  });
}
// 新しい項目は、記録用の項目（作成日時など）の手前に入れる
function insertField(nf) {
  const fs = activeFields();
  let at = fs.findIndex(f => f.readonly && f.id !== 'no');
  if (at < 0) at = fs.length;
  fs.splice(at, 0, nf);
  doc.fields.push(nf);
  fs.forEach((f, k) => { if (f.order !== k) f.order = k; });
}
function deleteField(fid) {
  mutate(() => {
    const f = fieldById(fid); if (!f || f.system) return;
    f.deleted = true;
    delete ui.filters[fid];
    for (const k of ['kanbanField', 'dueField', 'assigneeField', 'groupField']) if (doc.settings[k] === fid) doc.settings[k] = k === 'kanbanField' ? 'status' : '';
    doc.settings.cardFields = (doc.settings.cardFields || []).filter(x => x !== fid);
  });
}
function openFieldEditor(fid, after) {

    <label class="opt-lbl">選択肢</label><div class="opt-box"><div id="fe-opts"></div><button class="btn sm" data-k="addopt">＋ 選択肢を追加</button>${f && f.id === 'status' ? '<div class="hint">「完了扱い」にした選択肢は、ダッシュボードや「未完了」の絞り込みで完了として数えます。</div>' : ''}</div>

    }

      if ((type === 'select' || type === 'multiselect') && !cleaned.length) return toast('選択肢を1つ以上入力してください', true);
      for (const o of cleaned) if (!o.done) delete o.done;
      mutate(() => {
        if (f) {
          const t = fieldById(f.id);
          t.name = name;
          if (!typeLocked) t.type = type;
          if (t.type === 'select' || t.type === 'multiselect') t.options = cleaned; else delete t.options;
        } else {

function openRules() {

      (rs.length ? '<div class="flist">' + rs.map((r, n) => {

      }).join('') + '</div>' : '<p class="muted">ルールはまだありません。</p>');

  }
  function condRow(c, n) {
    const f = fieldById(c.fieldId);
    const ops = opsFor(f);
    if (!ops.find(o => o[0] === c.op)) c.op = ops[0] ? ops[0][0] : '';
    const op = ops.find(o => o[0] === c.op);
    let val = '';
    const kind = op ? op[2] : '';
    if (kind === 'o') { if (!optById(f, c.value)) c.value = (f.options || [])[0] ? f.options[0].id : ''; val = `<select class="sel" data-ck="value" data-n="${n}">${(f.options || []).map(o => `<option value="${esc(o.id)}"${o.id === c.value ? ' selected' : ''}>${esc(o.label)}</option>`).join('')}</select>`; }
    else if (kind === 'd') val = `<input class="inp" style="width:72px" data-ck="value" data-n="${n}" inputmode="numeric" value="${esc(c.value == null ? 3 : c.value)}"> 日`;
    else if (kind === 'D') val = `<input class="inp" type="date" data-ck="value" data-n="${n}" value="${esc(c.value || '')}">`;
    else if (kind === 'n') val = `<input class="inp" style="width:100px" data-ck="value" data-n="${n}" inputmode="decimal" value="${esc(c.value == null ? '' : c.value)}">`;
    else if (kind === 't') val = `<input class="inp" data-ck="value" data-n="${n}" value="${esc(c.value == null ? '' : c.value)}">`;
    if (kind === 'd' && c.value == null) c.value = 3;
    return `<div class="cond-row"><select class="sel" data-ck="fieldId" data-n="${n}">${fields.map(x => `<option value="${esc(x.id)}"${x.id === c.fieldId ? ' selected' : ''}>${esc(x.name)}</option>`).join('')}</select><select class="sel" data-ck="op" data-n="${n}">${ops.map(o => `<option value="${o[0]}"${o[0] === c.op ? ' selected' : ''}>${esc(o[1])}</option>`).join('')}</select>${val}<button class="iconbtn" data-k="delc" data-n="${n}" aria-label="条件を削除">×</button></div>`;
  }
  function draw() {
    $('#re-conds', m).innerHTML = r.conditions.map(condRow).join('');
    swatches($('#re-bg', m), RULE_BG, 'bg');
    swatches($('#re-fg', m), RULE_FG, 'color');
    preview();
  }
  function preview() {
    r.style.bold = $('#re-bold', m).checked || undefined;
    r.style.strike = $('#re-strike', m).checked || undefined;
    $('#re-pv', m).setAttribute('style', styleCss(r.style).replace(/&quot;/g, '"'));
    const tmp = Object.assign({}, r, { match: $('#re-match', m).value });

  }
  draw();
  m.addEventListener('change', e => {
    const ck = e.target.dataset.ck, n = +e.target.dataset.n;
    if (ck) {
      const c = r.conditions[n];
      if (ck === 'fieldId') { c.fieldId = e.target.value; c.op = ''; c.value = undefined; }
      else if (ck === 'op') { c.op = e.target.value; c.value = undefined; }
      else c.value = condValue(c, e.target.value);
      if (ck !== 'value') draw(); else preview();
    }
    if (e.target.dataset.swc) { r.style[e.target.dataset.swc] = e.target.value; draw(); }
    if (e.target.id === 're-bold' || e.target.id === 're-strike' || e.target.id === 're-match') preview();
  });
  m.addEventListener('input', e => { if (e.target.dataset.ck === 'value' && e.target.tagName === 'INPUT') { const c = r.conditions[+e.target.dataset.n]; c.value = condValue(c, e.target.value); preview(); } });
  m.addEventListener('click', e => {
    const k = e.target.dataset.k;
    if (e.target.dataset.sw) { r.style[e.target.dataset.sw] = e.target.dataset.c || undefined; draw(); }
    if (k === 'addc') { r.conditions.push({ fieldId: 'status', op: '' }); draw(); }
    if (k === 'delc') { r.conditions.splice(+e.target.dataset.n, 1); draw(); }
    if (k === 'ok') {
      const name = $('#re-name', m).value.trim();
      if (!name) return toast('ルール名を入力してください', true);
      if (!r.conditions.length) return toast('条件を1つ以上追加してください', true);
      r.name = name; r.match = $('#re-match', m).value; r.target = $('#re-target', m).value;
      for (const k2 of Object.keys(r.style)) if (!r.style[k2]) delete r.style[k2];
      for (const c of r.conditions) if (c.value === undefined) delete c.value;
      mutate(() => {
        if (orig) { const t = doc.rules.find(x => x.id === orig.id); Object.assign(t, r); }
        else { r.order = activeRules().length; doc.rules.push(r); }
      });
      closeModal(m);
      if (after) after();
    }
  });
}

function guessType(values) {
  const v = values.map(x => String(x).trim()).filter(Boolean);
  if (!v.length) return 'text';
  if (v.every(x => /^(https?:\/\/|mailto:)/i.test(x) && parseLinksText(x))) return 'link';
  if (v.every(x => /^[-+]?[\d,，]+(\.\d+)?$/.test(toHalf(x)))) return 'number';
  if (v.every(x => /^\d{4}[\/\-.年]\d{1,2}[\/\-.月]\d{1,2}/.test(toHalf(x)))) return 'date';
  if (v.some(x => x.includes('\n'))) return 'longtext';
  const uniq = new Set(v);
  if (v.length >= 4 && uniq.size <= Math.min(12, Math.ceil(v.length / 2))) return 'select';
  return 'text';
}
function openImport(initialText) {
  const body = `<p style="margin-top:0">Excelで表の範囲（見出しの行を含む）をコピーして、下に貼り付けてください。CSVファイルも読み込めます。</p>
    <textarea class="inp" id="im-text" style="min-height:120px;font-family:ui-monospace,monospace;font-size:12px" placeholder="ここに貼り付け（Ctrl+V）"></textarea>
    <div style="display:flex;gap:12px;align-items:center;margin:8px 0 12px;flex-wrap:wrap"><label class="btn sm">CSVファイルを選ぶ<input type="file" id="im-file" accept=".csv,.tsv,.txt" hidden></label><label><input type="checkbox" id="im-head" checked> 1行目は見出し</label><span class="hint" id="im-info"></span></div>
    <div id="im-map"></div>`;
  const m = openModal({ title: 'Excel・CSVから取り込む', body, wide: true, foot: '<button class="btn" data-close>キャンセル</button><button class="btn primary" data-k="ok" disabled>取り込む</button>' });
  const ta = $('#im-text', m);
  let rows = [], mapping = [];
  function parse() {
    const t = ta.value;
    rows = t.trim() ? parseDelimited(t, t.includes('\t') ? '\t' : ',').filter(r => r.some(c => String(c).trim())) : [];
    const head = $('#im-head', m).checked;
    const headers = head && rows.length ? rows[0] : (rows[0] || []).map((_, n) => `列${n + 1}`);
    const data = head ? rows.slice(1) : rows;
    const width = Math.max(0, ...rows.map(r => r.length));
    const fs = activeFields().filter(f => !f.readonly);
    mapping = [];
    let html = '';
    if (rows.length) {
      html = '<table class="map-tbl"><thead><tr><th>取り込む列</th><th>例</th><th>取り込み先</th></tr></thead><tbody>';
      for (let c = 0; c < width; c++) {
        const name = String(headers[c] || `列${c + 1}`).trim();
        const samples = data.slice(0, 3).map(r => r[c] || '').filter(Boolean);
        const ex = fs.find(f => f.name === name) || (/^(件名|タイトル|題名|課題|内容|概要)$/.test(name) ? fieldById('title') : null) || (/^(状態|ステータス|進捗|状況)$/.test(name) ? fieldById('status') : null);
        const skip = /^(id|no\.?|番号|#|№)$/i.test(name);
        const def = skip ? 'skip' : ex ? ex.id : 'new';
        mapping.push({ c, name, target: def, type: guessType(data.map(r => r[c] || '')) });
        html += `<tr><td>${esc(name)}</td><td class="smp" title="${esc(samples.join(' / '))}">${esc(samples.join(' / '))}</td><td><select class="sel" data-mc="${c}"><option value="skip"${def === 'skip' ? ' selected' : ''}>取り込まない</option>${fs.map(f => `<option value="${esc(f.id)}"${def === f.id ? ' selected' : ''}>${esc(f.name)}</option>`).join('')}<option value="new"${def === 'new' ? ' selected' : ''}>＋ 新しい項目にする</option></select> <select class="sel" data-mt="${c}" style="${def === 'new' ? '' : 'display:none'}">${Object.entries(TYPES).map(([k, v]) => `<option value="${k}"${k === mapping[c].type ? ' selected' : ''}>${v}</option>`).join('')}</select></td></tr>`;
      }
      html += '</tbody></table>';
    }
    $('#im-map', m).innerHTML = html;
    $('#im-info', m).textContent = rows.length ? `${data.length}行・${width}列` : '';
    $('[data-k=ok]', m).disabled = !data.length;
  }

    const buf = await f.arrayBuffer();
    let text = new TextDecoder('utf-8').decode(buf);
    if (text.includes('�')) { try { text = new TextDecoder('shift_jis').decode(buf); } catch (er) { /* そのまま */ } }
    ta.value = text.replace(/^﻿/, ''); parse();
  });

    if (e.target.dataset.mc != null) { const mp = mapping[+e.target.dataset.mc]; mp.target = e.target.value; $(`[data-mt="${mp.c}"]`, m).style.display = mp.target === 'new' ? '' : 'none'; }
    if (e.target.dataset.mt != null) mapping[+e.target.dataset.mt].type = e.target.value;
  });
  m.addEventListener('click', e => {
    if (e.target.dataset.k !== 'ok') return;
    const used = mapping.filter(x => x.target !== 'skip');
    const dup = used.filter(x => x.target !== 'new').map(x => x.target).filter((t, n, a) => a.indexOf(t) !== n);
    if (dup.length) return toast('同じ項目に2つ以上の列が割り当てられています', true);
    const head = $('#im-head', m).checked;

      for (const mp of used) {
        if (mp.target !== 'new') continue;
        const nf = { id: 'f' + uid().slice(0, 8), name: mp.name, type: mp.type, order: 0, width: mp.type === 'longtext' ? 240 : 130 };
        if (nf.type === 'select' || nf.type === 'multiselect') nf.options = [];

      }
      for (const r of data) {
        const vals = {};
        for (const mp of used) {
          const f = fieldById(mp.target);
          const c = convertInput(f, r[mp.c] || '', true);
          if (c.ok) { if (!isEmpty(c.value)) vals[f.id] = c.value; } else bad++;
        }
        newIssue(vals);
      }
    });
    closeModal(m);
    toast(`${data.length}件の課題を取り込みました${bad ? `（読み取れなかったセル ${bad}個）` : ''}`, bad > 0);
  });
}
function exportCsv() {
  const fs = activeFields();
  const q = s => { s = String(s == null ? '' : s); return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const t = treeInfo();
  const cell = (i, f) => { const v = getVal(i, f); if (f.type === 'no') return i.no; if (f.type === 'checkbox') return v ? '○' : ''; if (f.type === 'link') return linksOf(v).map(l => (l.title ? `${l.title} (${l.url})` : l.url)).join('\n'); return displayText(i, f); };
  const lines = [['ID', '親ID'].concat(fs.filter(f => f.id !== 'no').map(f => f.name)).map(q).join(',')];
  for (const r of treeRows(activeIssues(), { expandAll: true }).rows) { const i = r.i, p = t.parentOf(i); lines.push([i.no, p ? p.no : ''].concat(fs.filter(f => f.id !== 'no').map(f => cell(i, f))).map(q).join(',')); }
  const blob = new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${doc.settings.title || '課題管理表'}_${today().replace(/-/g, '')}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

      e.preventDefault();
      const i = issueById(ui.sel.iid);
      setValues(ui.sel.iid, { [sf.id]: addLinks(i && i.values[sf.id], ls) });
      toast(ls.length > 1 ? `${ls.length}件のリンクを追加しました` : 'リンクを追加しました');
      return;
    }
  }
  if (!text) return;
  e.preventDefault();
  pasteGrid(text.replace(/\r?\n$/, ''));
});
document.addEventListener('scroll', e => { if (ui.editing && !ui.editing.choice && e.target.id === 'tableWrap') endEdit(true); }, true);
window.addEventListener('beforeunload', e => { if (isDirty()) { e.preventDefault(); e.returnValue = ''; } });
window.addEventListener('focus', () => poll());
setInterval(poll, POLL_MS);
setInterval(() => { if (ui.view === 'dash' && !openModals.length && !activePop) renderView(); }, 60000);

/* ---------- 起動 ---------- */
(async function boot() {
  renderAll();
  if (!me) askName();
  if (!FS) return;
  const h = await idb.get(handleKey());
  if (!h) return;
  storedHandle = h;
  if (await hasPerm(h, false)) await connect(h, { askName: false });
  else renderBanners();
})();

// 動作確認用のフック
window.__kk = { normalize, get doc() { return doc; }, get base() { return base; }, file, ui, prefs, mergeDocs, save, poll, connect, convertInput, parseDelimited, ruleMatches };
})();
